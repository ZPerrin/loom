# loom.toml — loom's own harness config (loom dogfoods its linter/slicer).
[discovery]
exclude = ["tests/fixtures", "skills", "docs/superpowers"]

[context]
recent_commits = 10
slice_headers = ["## Now"]
inject_fields = ["updated", "kind", "location"]

[lint]
kinds = ["roadmap", "readme", "guide", "reference", "spec", "plan", "design", "review", "loom-config"]
statuses = ["living", "hardened", "superseded", "scaffolding", "ideation"]
