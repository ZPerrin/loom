# loom.toml — loom's own harness config (loom dogfoods its linter/slicer).
[discovery]
exclude = ["tests/fixtures", "skills"]

[context]
recent_commits = 10
slice_headers = ["## Now"]
inject_fields = ["updated", "kind", "location"]

[lint]
kinds = ["readme", "reference", "roadmap", "loom-config", "spec", "plan"]
statuses = ["living", "hardened", "superseded", "scaffolding", "ideation"]
meta_denylist = ["off"]   # this repo's subject IS the doc system; the META tripwire would eat its own tail

[warp]
branch_convention = "issue/<number>-<slug> | feature/<slug>"  # issue-backed off main | ad-hoc local
work_source = "github"        # /warp <issue-ref> fetched from origin; free text/none → ad-hoc feature
worktree = "always"           # standardized at ../loom-worktrees/<branch> (see warp.md)

[weft]
cleanup = "ask"               # after merge, weft asks whether to delete the merged branch (not the worktree)
