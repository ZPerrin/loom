[discovery]
exclude = ["tests/fixtures", "skills"]

[context]
recent_commits = 10
slice_headers = ["## Now"]
inject_fields = ["updated", "kind", "location"]

[lint]
kinds = ["readme", "reference", "roadmap", "loom-config", "spec", "plan"]
statuses = ["living", "hardened", "superseded", "scaffolding", "ideation"]

[warp]
branch_convention = "issue/<number>-<slug> | feature/<slug>"
source_repo = "."
source_branch = "master"
worktree = "harness"
hook = "warp.sh"

[weave]
cleanup = "always"
rsi = "always"
